<!--
  Fonts, self-hosted from public/fonts/ (Archivo and Public Sans, both
  SIL Open Font License, see the OFL-*.txt files there). The rules below
  are Google Fonts' own CSS for
  css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&display=swap
  with only the URLs changed, so text renders exactly as it did from
  Google. Inline, so there's no stylesheet to wait for; font-display:
  swap shows text in the fallback font until a file arrives. Both
  families are variable fonts: one file per script holds every weight.
  The two Latin files are preloaded, since every page uses them. To
  change the weights, fetch that URL again with a Chrome user agent and
  replace these rules and files. Give new files new names: public/_headers
  lets browsers cache /fonts/ for a year.
-->

<!--
  Fonts for every page, campaign funnels included, injected at each
  page's fonts-agency marker comment by vite.config.ts.

  Self-hosted from public/fonts/ (Playfair Display and Figtree, both SIL
  Open Font License; see the OFL-*.txt files there), so pages don't wait
  on, or send visitors' details to, Google Fonts. The rules below are
  Google Fonts' own CSS for
  css2?family=Playfair+Display:wght@400;500;600&family=Figtree:wght@400;500;600;700&display=swap
  with only the URLs changed, so text renders exactly as it did from
  Google. Both are variable fonts: one file per character set holds every
  weight, and unicode-range means browsers only download the sets a page
  actually uses. The two Latin files are preloaded, since every page
  uses them. To change weights, fetch that URL again with a Chrome user
  agent and replace these rules and files. Give new files new names:
  public/_headers lets browsers cache /fonts/ for a year.
-->

  /* Stand-ins shown while the fonts above load (font-display: swap),
     resized to the real fonts' proportions so text doesn't jump when
     they arrive (the home headline used to, enough for a CLS of 0.1).
     size-adjust is the ratio of average character widths, the overrides
     the real font's ascent and descent at that size. Used through
     --font-sans and --font-serif in src/index.css, in this order.

     Not every device has Georgia and Arial: Android has Noto Serif and
     Roboto instead, and Linux (where Lighthouse and PageSpeed Insights
     run) has Liberation Serif and Liberation Sans, the free copies of
     Times New Roman and Arial. Each needs its own sizes (Times New Roman
     is about 13% narrower than Playfair), so each gets its own family;
     a device without a font skips that family and tries the next.

     Georgia and Arial regular: Capsize's metrics (@capsizecss/metrics).
     The rest were measured in Chromium against the real files (canvas
     measureText over a few lines of the site's copy, at the weights
     headings and body text use). Arial and Roboto get a bold face too,
     since buttons and labels are 600-700 and bold Arial is much wider
     than Figtree's bold. */
  @font-face {
    font-family: 'Playfair Display Fallback';
    src: local('Georgia');
    size-adjust: 101.39%;
    ascent-override: 106.72%;
    descent-override: 24.76%;
    line-gap-override: 0%;
  }
  @font-face {
    font-family: 'Playfair Display Fallback Times';

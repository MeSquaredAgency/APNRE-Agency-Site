<!--
  Injected into every page's head at its "shared-head" marker comment by
  the sharedHead plugin in vite.config.ts, so favicons, fonts and
  analytics only live in one place. The marker sits right after
  <meta viewport> in each page, so this — including GTM — loads as high
  in <head> as possible while still letting <meta charset> stay first.
-->
<!--
  Google Tag Manager. VITE_GTM_ID comes from the same env source as the
  Meta Pixel ID below (see .env). Leaving it blank is safe: the "if"
  below is false at build time and the snippet never runs. GA4 itself is
  configured as a Google tag inside this GTM container (GTM-P5H7NTCF),
  not built here — see the Meta-Pixel-only script further down. Matching
  <noscript> iframe: src/partials/body-shared.html, injected immediately
  after <body> on every page.
-->
<!--
  Analytics and the Meta Pixel only run on the live site, so dev-server
  visits, Cloudflare preview deployments (*.pages.dev) and test
  submissions don't land in APN's real analytics or ad data. That's
  apnre.com.au, www. and go. (the campaign funnels, docs/funnels.md). Add
  a hostname here if the site ever moves.
-->
<script>
  window.__APN_LIVE = /^(www\.|go\.)?apnre\.com\.au$/.test(location.hostname);
</script>
<script>
  if ('%VITE_GTM_ID%' && window.__APN_LIVE) {
    (function (w, d, s, l, i) {
      w[l] = w[l] || [];
      w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
      var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s),
        dl = l != 'dataLayer' ? '&l=' + l : '';
      j.async = true;
      j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
      f.parentNode.insertBefore(j, f);
    })(window, document, 'script', 'dataLayer', '%VITE_GTM_ID%');
  }
</script>

<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="180x180" href="/favicon-180.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<!-- Stock photos come from Pexels' CDN (src/data/media.ts). -->
<link rel="preconnect" href="https://images.pexels.com" />
<!--
  Meta Pixel. The ID is VITE_META_PIXEL_ID in the repo's .env (it's a
  public ID, visible in every page anyway); a Cloudflare Pages
  environment variable of the same name overrides it.

  Leaving it unset is safe: the "if" below is false at build time and
  this script never runs. No placeholder ID to remember to swap out
  before launch.

  On the main site, Meta's 110 KB script waits until the page has loaded
  and the browser is idle, so it doesn't compete with the page itself.
  fbq() calls before then are queued and sent once it arrives. The
  campaign funnels on go. load it straight away as before, so ad
  conversion tracking there is unchanged.
-->
<script>
  if ('%VITE_META_PIXEL_ID%' && window.__APN_LIVE) {
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () {
        n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
      };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
      n.queue = []; t = b.createElement(e); t.async = !0; t.src = v;
      var load = function () {
        s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
      };
      if (location.hostname.indexOf('go.') === 0) return load();
      var idle = function () {
        (f.requestIdleCallback || function (cb) { setTimeout(cb, 1); })(load, { timeout: 3000 });
      };
      if (b.readyState === 'complete') idle();
      else f.addEventListener('load', idle);
    }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
    window.fbq('init', '%VITE_META_PIXEL_ID%');
    window.fbq('track', 'PageView');
  }
</script>

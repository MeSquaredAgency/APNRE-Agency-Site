<!--
  Injected into every page's head at its "shared-head" marker comment by
  the sharedHead plugin in vite.config.ts, so favicons, fonts and
  analytics only live in one place. The marker sits right after
  <meta viewport> in each page, so this — including GTM — loads as high
  in <head> as possible while still letting <meta charset> stay first.
-->
<!--
  Google Tag Manager. VITE_GTM_ID comes from the same env source as the
  Meta Pixel ID below (see .env). Leaving it blank is safe: the "if"
  below is false at build time and the snippet never runs. GA4 itself is
  configured as a Google tag inside this GTM container (GTM-P5H7NTCF),
  not built here — see the Meta-Pixel-only script further down. Matching
  <noscript> iframe: src/partials/body-shared.html, injected immediately
  after <body> on every page.

  On the main site GTM (and the Google tag it brings in, about 330 KB
  between them) waits until the page has loaded and the browser is idle,
  like the Meta Pixel below, so it doesn't hold up the page's first
  render on phones. Events pushed before then wait on the dataLayer and
  are sent once it arrives, page_view included. trackFormSubmit()
  (src/lib/analytics.ts) loads it straight away through
  window.__apnLoadGtm if a form is sent before then, so no lead is
  missed. Campaign funnel pages (data-funnel on <html>) load it
  immediately, since that's where ad conversions happen.

  Cloudflare's Google tag gateway must not inject its own copy of GTM
  (its automatic tag injection is off), or the container loads twice.
-->
<!--
  Analytics and the Meta Pixel only run on the live site, so dev-server
  visits, Cloudflare preview deployments (*.pages.dev) and test
  submissions don't land in APN's real analytics or ad data. That's
  apnre.com.au and www. (campaign funnels included, docs/funnels.md). Add
  a hostname here if the site ever moves.
-->
<script>
  window.__APN_LIVE = /^(www\.)?apnre\.com\.au$/.test(location.hostname);
</script>
<script>
  if ('%VITE_GTM_ID%' && window.__APN_LIVE) {
    (function (w, d, s, l, i) {
      w[l] = w[l] || [];
      w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
      var loaded = false;
      var load = (w.__apnLoadGtm = function () {
        if (loaded) return;
        loaded = true;
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      });
      if (d.documentElement.hasAttribute('data-funnel')) return load();
      var idle = function () {
        (w.requestIdleCallback || function (cb) { setTimeout(cb, 1); })(load, { timeout: 3000 });
      };
      if (d.readyState === 'complete') idle();
      else w.addEventListener('load', idle);
    })(window, document, 'script', 'dataLayer', '%VITE_GTM_ID%');
  }
</script>

<!--
  Meta Pixel. The ID is VITE_META_PIXEL_ID in the repo's .env (it's a
  public ID, visible in every page anyway); a Cloudflare Pages
  environment variable of the same name overrides it.

  Leaving it unset is safe: the "if" below is false at build time and
  this script never runs. No placeholder ID to remember to swap out
  before launch.

  On the main site, Meta's script (about 200 KB with what it pulls in)
  waits for the visitor's first scroll, tap, click or key press, or 10
  seconds after the page has loaded, whichever comes first. Loaded any
  earlier it was the biggest single cause of the main thread being
  blocked on phones (the October 2026 SEO audit measured 300-450 ms).
  fbq() calls before then are queued and sent once it arrives, PageView
  included, and a form sent before then loads it straight away through
  window.__apnLoadPixel (src/lib/analytics.ts). Campaign funnel pages
  (the "funnel" routes in src/data/routes.json, which get a data-funnel
  attribute on <html>) load it straight away, since they're where ad
  conversions happen. After changing this, check Meta's Events Manager
  still attributes leads to ads as before.
-->
<script>
  if ('%VITE_META_PIXEL_ID%' && window.__APN_LIVE) {
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () {
        n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
      };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
      n.queue = []; t = b.createElement(e); t.async = !0; t.src = v;
      var loaded = false;
      var load = (f.__apnLoadPixel = function () {
        if (loaded) return;
        loaded = true;
        s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
      });
      if (b.documentElement.hasAttribute('data-funnel')) return load();
      var first = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
      var go = function () {
        first.forEach(function (type) { f.removeEventListener(type, go, true); });
        load();
      };
      first.forEach(function (type) { f.addEventListener(type, go, { capture: true, passive: true }); });
      var later = function () { setTimeout(go, 10000); };
      if (b.readyState === 'complete') later();
      else f.addEventListener('load', later);
    }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
    window.fbq('init', '%VITE_META_PIXEL_ID%');
    window.fbq('track', 'PageView');
  }
</script>

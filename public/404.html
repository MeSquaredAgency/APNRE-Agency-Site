<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | APN Real Estate</title>
    <!--
      Cloudflare Pages serves this file with a real HTTP 404 for any path
      that doesn't match a built file. Its presence at the output root is
      also what turns OFF Pages' default SPA fallback (every unknown path
      returning index.html with a 200), which Google was reporting as soft
      404s. The only valid routes are the built pages listed in
      src/data/routes.json.

      This file is copied verbatim from public/ — Vite doesn't process it —
      so keep it self-contained and only reference files in public/.
    -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Public+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --lime: #8dc600;
        --lime-light: #a3d93a;
        --charcoal-900: #17171a;
        --grey-mid: #6d6e71;
        --paper: #f6f4ee;
        --font-display: 'Archivo', 'Arial Narrow', sans-serif;
        --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        font-family: var(--font-body);
        background: var(--paper);
        color: var(--charcoal-900);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        text-align: center;
      }
      main { max-width: 520px; }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin: 0 auto 32px;
        text-decoration: none;
        color: var(--charcoal-900);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      .logo img { width: 180px; height: auto; display: block; }
      .code {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--charcoal-900);
        margin: 0 0 12px;
      }
      h1 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(32px, 7vw, 48px);
        line-height: 1.05;
        letter-spacing: -0.01em;
        margin: 0 0 16px;
      }
      p { margin: 0 0 32px; color: var(--grey-mid); }
      a.button {
        display: inline-block;
        padding: 14px 28px;
        background: var(--lime);
        color: var(--charcoal-900);
        font-weight: 600;
        text-decoration: none;
        border-radius: 3px;
      }
      a.button:hover, a.button:focus-visible { background: var(--lime-light); }
    </style>
  </head>
  <body>
    <main>
      <a class="logo" href="/"><img src="/apn-logo-full.png" alt="Adelaide Property Network — APN Real Estate" width="180" height="120" /></a>
      <p class="code">Error 404</p>
      <h1>We couldn't find that page</h1>
      <p>The link may be out of date, or the address may have been mistyped.</p>
      <a class="button" href="/">Back to APN Real Estate</a>
    </main>
  </body>
</html>

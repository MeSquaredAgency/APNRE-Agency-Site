# /etc/vsftpd.conf on the listings feed server (docs/listings-feed.md).
# One FTP account, "propertyme", locked inside /srv/propertyme. PropertyMe
# only uploads over plain FTP, so the firewall (setup step 3) is what
# keeps everyone else out.

listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Only the accounts in /etc/vsftpd.userlist can log in.
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Each account sees only its own folder.
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/srv/propertyme

# Passive mode, which PropertyMe's uploader will use. The ports must
# match the firewall rule, and pasv_address must be the server's static
# external IP (setup step 2).
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=REPLACE_WITH_STATIC_IP

xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=NO
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
